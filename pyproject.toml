[project]
name = "detector-ia"
version = "0.1.0"
description = "Detector de texto generado por IA y de copia entre entregas, con reporte CSV"
keywords = ["ia", "plagio", "educacion", "roberta", "docencia"]
readme = "README.md"
authors = [
    { name = "Alberto Ortiz", email = "albertoortixsanchez@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "torch>=2.15.0",
    "transformers>=5.23.0",
]

[project.scripts]
detector-ia = "detector_ia:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
