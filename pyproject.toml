[project]
name = "detector-ia"
version = "1.0.0"
description = "Detector de texto generado por IA y de copia entre entregas · AI-text and plagiarism detection for student submissions"
keywords = [
    "ia",
    "ai-detection",
    "plagio",
    "plagiarism",
    "educacion",
    "education",
    "roberta",
    "docencia",
    "teaching",
    "csv",
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Alberto Ortiz Sánchez" }]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "pandas>=3.1.1",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/alberto2005-coder/detector-ia"
Repository = "https://github.com/alberto2005-coder/detector-ia"
Issues = "https://github.com/alberto2005-coder/detector-ia/issues"
Changelog = "https://github.com/alberto2005-coder/detector-ia/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Sin este extra la herramienta funciona con --sin-modelo, solo con las señales estructurales
modelo = [
    "torch>=2.15.0",
    "transformers>=5.23.0",
]

[project.scripts]
detector-ia = "detector_ia:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
