[project]
name = "detector-ia"
version = "1.2.0"
description = "Detector de texto generado por IA y de copia entre entregas · AI-text and plagiarism detection for student submissions"
keywords = [
    "ia",
    "ai-detection",
    "plagio",
    "plagiarism",
    "educacion",
    "education",
    "roberta",
    "docencia",
    "teaching",
    "csv",
    "cli",
    "jupyter",
    "pdf",
    "docx",
    "similarity",
    "winnowing",
    "binoculars",
    "html-report",
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Alberto Ortiz Sánchez" }]
maintainers = [{ name = "Alberto Ortiz Sánchez" }]
requires-python = ">=3.13"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: Spanish",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=3.1.1",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/alberto2005-coder/detector-ia"
Repository = "https://github.com/alberto2005-coder/detector-ia"
Issues = "https://github.com/alberto2005-coder/detector-ia/issues"
Documentation = "https://github.com/alberto2005-coder/detector-ia#readme"
Changelog = "https://github.com/alberto2005-coder/detector-ia/blob/main/CHANGELOG.md"
"Usage guide" = "https://github.com/alberto2005-coder/detector-ia/blob/main/docs/USAGE.md"
"Method" = "https://github.com/alberto2005-coder/detector-ia/blob/main/docs/METODO.md"
"Responsible use" = "https://github.com/alberto2005-coder/detector-ia/blob/main/docs/USO_RESPONSABLE.md"
Security = "https://github.com/alberto2005-coder/detector-ia/blob/main/SECURITY.md"
Author = "https://github.com/alberto2005-coder/"
Website = "https://albertoortiz.is-a.dev/"

[project.optional-dependencies]
# Sin este extra la herramienta funciona con --sin-modelo, solo con las señales estructurales
modelo = [
    "torch>=2.15.0",
    "transformers>=5.23.0",
]
# Solo para --traduccion (plagio traducido entre español e inglés)
semantica = [
    "sentence-transformers>=6.0.0",
]

[project.scripts]
detector-ia = "detector_ia:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"
