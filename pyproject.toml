[project]
name = "detector-ia"
version = "1.0.2"
description = "Detector de texto generado por IA y de copia entre entregas · AI-text and plagiarism detection for student submissions"
keywords = [
    "ia",
    "ai-detection",
    "plagio",
    "plagiarism",
    "educacion",
    "education",
    "roberta",
    "docencia",
    "teaching",
    "csv",
    "cli",
    "jupyter",
    "pdf",
    "docx",
    "similarity",
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Alberto Ortiz Sánchez" }]
maintainers = [{ name = "Alberto Ortiz Sánchez" }]
requires-python = ">=3.13"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: Spanish",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
]
dependencies = [
    "annotated-doc>=0.0.6",
    "annotated-types>=0.8.0",
    "anyio>=4.16.0",
    "click>=8.5.1",
    "filelock>=4.2.10",
    "fsspec>=2026.9.0",
    "h11>=0.16.0",
    "hf-xet>=1.8.0",
    "httpcore2>=2.16.0",
    "httpx2>=2.16.0",
    "huggingface-hub>=2.4.0",
    "idna>=3.20",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.3.0",
    "markupsafe>=3.0.4",
    "mdurl>=0.1.2",
    "mpmath>=1.3.0",
    "networkx>=3.7",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pydantic-core>=2.50.4",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "regex>=2026.11.9",
    "rich>=15.0.0",
    "safetensors>=0.8.0",
    "setuptools>=84.2.1",
    "shellingham>=1.5.4",
    "sympy>=1.14.0",
    "tokenizers>=0.23.3",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "transformers>=5.23.0",
    "truststore>=0.10.5",
    "typer>=0.29.1",
    "typing-inspection>=0.4.5",
]

[project.urls]
Homepage = "https://github.com/alberto2005-coder/detector-ia"
Repository = "https://github.com/alberto2005-coder/detector-ia"
Issues = "https://github.com/alberto2005-coder/detector-ia/issues"
Documentation = "https://github.com/alberto2005-coder/detector-ia#readme"
Changelog = "https://github.com/alberto2005-coder/detector-ia/blob/main/CHANGELOG.md"
"Usage guide" = "https://github.com/alberto2005-coder/detector-ia/blob/main/docs/USAGE.md"
"Method" = "https://github.com/alberto2005-coder/detector-ia/blob/main/docs/METODO.md"
"Responsible use" = "https://github.com/alberto2005-coder/detector-ia/blob/main/docs/USO_RESPONSABLE.md"
Security = "https://github.com/alberto2005-coder/detector-ia/blob/main/SECURITY.md"
Author = "https://github.com/alberto2005-coder/"
Website = "https://albertoortiz.is-a.dev/"

[project.optional-dependencies]
# Sin este extra la herramienta funciona con --sin-modelo, solo con las señales estructurales
modelo = [
    "torch>=2.15.0",
    "transformers>=5.23.0",
]

[project.scripts]
detector-ia = "detector_ia:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"
