name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Instalar Python 3.13
        run: uv python install 3.13

      - name: Construir wheel y sdist
        run: uv build

      - name: Extraer las notas del CHANGELOG
        run: uv run --no-project python scripts/notas_release.py "${GITHUB_REF_NAME#v}" > notas.md

      - name: Publicar la release
        uses: softprops/action-gh-release@v3
        with:
          name: detector-ia ${{ github.ref_name }}
          body_path: notas.md
          # Solo los artefactos del paquete, no cualquier cosa que haya en dist/
          files: |
            dist/*.whl
            dist/*.tar.gz

      - name: Guardar los artefactos
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publicar en PyPI
    needs: publicar
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/detector-ia
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Trusted Publishing: sin tokens. La acción genera y sube las atestaciones (procedencia)
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
